<!--
  Spec Agent icon — r41 v138 (Tom Gilb 2026-06-17 verbatim "spec agent
  glyph is not good, the + s are washed out").

  CANONICAL PLANGUAGE PLAN GLYPH:  [ * + * + * + * + * ]
  — brackets containing 5 colored asterisks joined by BOLD GOLD + signs.
  Each asterisk is the canonical Planguage type-glyph for ONE entry type,
  in its canonical color:
     ✻ Function  (green)
     ✻ Value     (violet)
     ✻ Solution  (orange)
     ✻ Constraint (red)
     ✻ Resource (blue)

  v138 fix vs v131: + signs now amber-300 (#fcd34d) at full stroke-width
  3, instead of washed-out slate-400 #94a3b8 at stroke 2.  Compositionally
  laid out as ONE horizontal row (no second-row compromise) — the 5 asterisks
  sit side-by-side at smaller scale, fitting cleanly in the 64×64 viewBox.

  ZERO English letters per DD-015 International Icons + Spell-out-Type-Names.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Spec Agent — canonical Plan glyph [*+*+*+*+*]: brackets containing 5 colored asterisks joined by + signs">
  <!-- Background — dark slate so colored glyph elements pop -->
  <rect width="64" height="64" fill="#0f172a" rx="6"/>

  <!-- Bracket [  (white for strong contrast) -->
  <g stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="6,16 2,16 2,48 6,48"/>
  </g>

  <!-- Asterisk 1 — Function (green) at x=11 -->
  <g stroke="#34d399" stroke-width="2.2" stroke-linecap="round">
    <line x1="11" y1="24" x2="11" y2="40"/>
    <line x1="4.5"  y1="36" x2="17.5" y2="28"/>
    <line x1="4.5"  y1="28" x2="17.5" y2="36"/>
  </g>

  <!-- + separator at x=20 — AMBER, BOLD, visible -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="29" x2="20" y2="35"/>
    <line x1="17" y1="32" x2="23" y2="32"/>
  </g>

  <!-- Asterisk 2 — Value (violet) at x=26 -->
  <g stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round">
    <line x1="26" y1="24" x2="26" y2="40"/>
    <line x1="19.5" y1="36" x2="32.5" y2="28"/>
    <line x1="19.5" y1="28" x2="32.5" y2="36"/>
  </g>

  <!-- + separator at x=35 -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="35" y1="29" x2="35" y2="35"/>
    <line x1="32" y1="32" x2="38" y2="32"/>
  </g>

  <!-- Asterisk 3 — Solution (orange) at x=41 -->
  <g stroke="#fb923c" stroke-width="2.2" stroke-linecap="round">
    <line x1="41" y1="24" x2="41" y2="40"/>
    <line x1="34.5" y1="36" x2="47.5" y2="28"/>
    <line x1="34.5" y1="28" x2="47.5" y2="36"/>
  </g>

  <!-- Bracket ] -->
  <g stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="58,16 62,16 62,48 58,48"/>
  </g>

  <!-- Second row inside same brackets — Constraint + Resource asterisks
       below.  Same amber + sign between them.  Compact placement leaves
       breathing room without crowding the first row. -->
  <g>
    <!-- Asterisk 4 — Constraint (red) at x=18 -->
    <g stroke="#f87171" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="48" x2="18" y2="60"/>
      <line x1="13" y1="57" x2="23" y2="51"/>
      <line x1="13" y1="51" x2="23" y2="57"/>
    </g>
    <!-- + separator at x=26 — AMBER -->
    <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
      <line x1="26" y1="52" x2="26" y2="57"/>
      <line x1="23.5" y1="54.5" x2="28.5" y2="54.5"/>
    </g>
    <!-- Asterisk 5 — Resource (blue) at x=32 -->
    <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
      <line x1="32" y1="48" x2="32" y2="60"/>
      <line x1="27" y1="57" x2="37" y2="51"/>
      <line x1="27" y1="51" x2="37" y2="57"/>
    </g>
  </g>
</svg>
