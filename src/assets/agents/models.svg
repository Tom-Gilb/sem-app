<!--
  Models agent icon — Tom Gilb 2026-06-17 verbatim "MOdels: a Blueprint of
  Building".  Classic blueprint — white architectural line drawing of a
  building elevation + plan grid on a deep cyan-blue background.  Blue
  accent (canonical Models colour).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Models — building blueprint">
  <!-- Blueprint blue background -->
  <rect width="64" height="64" fill="#1e3a8a" rx="6"/>

  <!-- Grid (faint blueprint grid lines) -->
  <g stroke="#3b82f6" stroke-width="0.3" opacity="0.5">
    <line x1="0" y1="8"  x2="64" y2="8" />
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="24" x2="64" y2="24"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="40" x2="64" y2="40"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
    <line x1="0" y1="56" x2="64" y2="56"/>
    <line x1="8"  y1="0" x2="8"  y2="64"/>
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="24" y1="0" x2="24" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="40" y1="0" x2="40" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
    <line x1="56" y1="0" x2="56" y2="64"/>
  </g>

  <!-- Building elevation — white line drawing of a 3-storey building -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <!-- Roof (triangle pediment) -->
    <polyline points="10,22 32,10 54,22" />
    <!-- Building outer walls -->
    <rect x="12" y="22" width="40" height="32"/>
    <!-- Ground line -->
    <line x1="6" y1="54" x2="58" y2="54" stroke-width="2"/>
    <!-- Floor dividers -->
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="12" y1="42" x2="52" y2="42"/>
    <!-- Windows row 1 -->
    <rect x="16" y="25" width="6" height="5"/>
    <rect x="26" y="25" width="6" height="5"/>
    <rect x="36" y="25" width="6" height="5"/>
    <rect x="44" y="25" width="4" height="5"/>
    <!-- Windows row 2 -->
    <rect x="16" y="35" width="6" height="5"/>
    <rect x="26" y="35" width="6" height="5"/>
    <rect x="36" y="35" width="6" height="5"/>
    <rect x="44" y="35" width="4" height="5"/>
    <!-- Door (ground floor) -->
    <rect x="28" y="46" width="8" height="8"/>
    <line x1="32" y1="46" x2="32" y2="54"/>
    <!-- Window beside door -->
    <rect x="18" y="46" width="6" height="5"/>
    <rect x="40" y="46" width="6" height="5"/>
  </g>

  <!-- Dimension annotation "PLAN" label at corner -->
  <text x="58" y="62" font-family="ui-monospace,monospace" font-size="5" font-weight="700" text-anchor="end" fill="#bfdbfe" letter-spacing="0.5">PLAN</text>
</svg>
