<!--
  Stakeholder Mapper icon — Tom Gilb 2026-06-17 verbatim "Stakeholder Agent:
  Planguage stakeholder glyph".  Renders the canonical PlStakeholderIcon
  form: ←§→ (violet solid value-arrow + blue hand-drawn § + green dashed
  resource-arrow).  Source: src/components/icons/PlStakeholderIcon.vue v9.
  Standalone .svg copy so AgentsStrip can <img>-import it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 64" width="72" height="64" aria-label="Stakeholder — canonical Planguage glyph ←§→">
  <!-- Background — dark indigo so the white-ringed glyph reads on the pin -->
  <rect width="72" height="64" fill="#1e1b4b" rx="6"/>

  <!-- ← violet solid arrow — value TO the stakeholder -->
  <g transform="translate(0 8)">
    <polyline points="5,21 0,24 5,27"
      fill="none" stroke="#a78bfa" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round" />
    <line x1="0" y1="24" x2="18" y2="24"
      stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />

    <!-- § hand-drawn (PlStakeholderIcon v9 canonical path) -->
    <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 44 11 L 41 14 Q 33 9 25 14 Q 21 21 33 24 Q 45 27 41 34 Q 33 39 25 34 L 22 37" />
    </g>

    <!-- → green dashed arrow — resources FROM stakeholder -->
    <line x1="48" y1="24" x2="66" y2="24"
      stroke="#4ade80" stroke-width="2"
      stroke-dasharray="4 2.5" stroke-linecap="round" />
    <polyline points="63,21 68,24 63,27"
      fill="none" stroke="#4ade80" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
