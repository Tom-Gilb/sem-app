<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <!--
    SEM App Favicon
    Three-level Keeney hierarchy icon (Value-Focused Thinking, 1992):
      TOP    = Fundamental level — amber  #FBB040  (given from above)
      MIDDLE = Strategic level  — violet  #A78BFA  (our own plan)
      BOTTOM = Means level      — emerald #6EE7B7  (supports us)
    Identical to icon-sem-app.svg — single source of truth for the brand glyph.
  -->

  <!-- Background: dark navy -->
  <rect width="200" height="200" rx="30" fill="#1B2B3C"/>

  <!-- Row separator lines -->
  <line x1="14" y1="72" x2="186" y2="72" stroke="#FBB040" stroke-width="0.8" opacity="0.25"/>
  <line x1="14" y1="128" x2="186" y2="128" stroke="#6EE7B7" stroke-width="0.8" opacity="0.25"/>


  <!-- ═══ STRATEGIC LEVEL — middle row (y=100) — Violet — full size, full opacity ═══ -->

  <!-- S · Stakeholder / Person (x=46) -->
  <g transform="translate(46,100)" fill="#A78BFA">
    <circle cy="-13" r="10.5"/>
    <path d="M-17,13 C-17,1 -9,-1 0,-1 C9,-1 17,1 17,13 Z"/>
  </g>

  <!-- E · Ends / Bullseye (x=100) -->
  <g transform="translate(100,100)" fill="none" stroke="#A78BFA">
    <circle r="20"  stroke-width="2.8"/>
    <circle r="11.5" stroke-width="2.8"/>
    <circle r="3.5" fill="#A78BFA" stroke="none"/>
  </g>

  <!-- M · Means / Arrow ← (x=154) — points LEFT: Means delivers INTO Ends -->
  <g transform="translate(154,100) scale(-1,1)" stroke="#A78BFA" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-19" y1="0" x2="15" y2="0" stroke-width="4"/>
    <polyline points="7,-9  17,0  7,9" fill="none" stroke-width="4"/>
  </g>


  <!-- ═══ FUNDAMENTAL LEVEL — top row (y=40) — Amber — 60% scale, 80% opacity ═══ -->

  <g opacity="0.80">
    <!-- S -->
    <g transform="translate(46,40) scale(0.60)" fill="#FBB040">
      <circle cy="-13" r="10.5"/>
      <path d="M-17,13 C-17,1 -9,-1 0,-1 C9,-1 17,1 17,13 Z"/>
    </g>
    <!-- E -->
    <g transform="translate(100,40) scale(0.60)" fill="none" stroke="#FBB040">
      <circle r="20"  stroke-width="2.8"/>
      <circle r="11.5" stroke-width="2.8"/>
      <circle r="3.5" fill="#FBB040" stroke="none"/>
    </g>
    <!-- M — reversed: Means delivers INTO Ends -->
    <g transform="translate(154,40) scale(-0.60,0.60)" stroke="#FBB040" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-19" y1="0" x2="15" y2="0" stroke-width="4"/>
      <polyline points="7,-9  17,0  7,9" fill="none" stroke-width="4"/>
    </g>
  </g>


  <!-- ═══ VALUE CASCADE — upward arrows in E column (Ends rise through levels) ═══ -->

  <!-- ↑ Means E → Strategic E -->
  <g opacity="0.45" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
    <line x1="100" y1="143" x2="100" y2="127"/>
    <polyline points="96,130 100,122 104,130"/>
  </g>

  <!-- ↑ Strategic E → Fundamental E -->
  <g opacity="0.45" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
    <line x1="100" y1="75" x2="100" y2="62"/>
    <polyline points="96,65 100,57 104,65"/>
  </g>


  <!-- ═══ MEANS LEVEL — bottom row (y=160) — Emerald — 60% scale, 80% opacity ═══ -->

  <g opacity="0.80">
    <!-- S -->
    <g transform="translate(46,160) scale(0.60)" fill="#6EE7B7">
      <circle cy="-13" r="10.5"/>
      <path d="M-17,13 C-17,1 -9,-1 0,-1 C9,-1 17,1 17,13 Z"/>
    </g>
    <!-- E -->
    <g transform="translate(100,160) scale(0.60)" fill="none" stroke="#6EE7B7">
      <circle r="20"  stroke-width="2.8"/>
      <circle r="11.5" stroke-width="2.8"/>
      <circle r="3.5" fill="#6EE7B7" stroke="none"/>
    </g>
    <!-- M — reversed: Means delivers INTO Ends -->
    <g transform="translate(154,160) scale(-0.60,0.60)" stroke="#6EE7B7" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-19" y1="0" x2="15" y2="0" stroke-width="4"/>
      <polyline points="7,-9  17,0  7,9" fill="none" stroke-width="4"/>
    </g>
  </g>


  <!-- ═══ VALUE DELIVERY — leftward arrows E → S (Values delivered to Stakeholders) ═══ -->

  <g opacity="0.40" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- Fundamental row (y=40) -->
    <line x1="86" y1="40" x2="63" y2="40"/>
    <polyline points="63,35 58,40 63,45"/>
    <!-- Strategic row (y=100) — shorter gap (full-size elements) -->
    <line x1="78" y1="100" x2="69" y2="100"/>
    <polyline points="69,96 65,100 69,104"/>
    <!-- Means row (y=160) -->
    <line x1="86" y1="160" x2="63" y2="160"/>
    <polyline points="63,155 58,160 63,165"/>
  </g>

</svg>
