<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <!-- ═══════════════════════════════════════════════
       SEM App Icon
       3 × 3 grid: rows = levels (above / MY / below)
                   cols = S (Stake) / E (Ends) / M (Means)
       Middle row: full size, full opacity — MY level
       Top/bottom: 55% scale, 25% opacity — adjacent levels
       ═══════════════════════════════════════════════ -->

  <!-- Background: dark navy -->
  <rect width="200" height="200" rx="30" fill="#1B2B3C"/>

  <!-- Subtle row separator lines to reinforce level structure -->
  <line x1="14" y1="72" x2="186" y2="72" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12"/>
  <line x1="14" y1="128" x2="186" y2="128" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12"/>


  <!-- ═══════════════════════════════════════════════
       MY LEVEL — middle row  (y=100)  full size, white
       ═══════════════════════════════════════════════ -->

  <!-- S · Stake / Person  (x=46) -->
  <g transform="translate(46,100)">
    <!-- head -->
    <circle cy="-13" r="10.5" fill="#FFFFFF"/>
    <!-- shoulders / body bust -->
    <path d="M-17,13 C-17,1 -9,-1 0,-1 C9,-1 17,1 17,13 Z" fill="#FFFFFF"/>
  </g>

  <!-- E · Ends / Bullseye  (x=100) -->
  <g transform="translate(100,100)" fill="none" stroke="#FFFFFF">
    <circle r="20"  stroke-width="2.8"/>
    <circle r="11.5" stroke-width="2.8"/>
    <circle r="3.5" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- M · Means / Arrow →  (x=154) — Planguage "impacts" & Scale symbol -->
  <g transform="translate(154,100)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-19" y1="0" x2="15" y2="0" stroke-width="4"/>
    <polyline points="7,-9  17,0  7,9" fill="none" stroke-width="4"/>
  </g>


  <!-- ═══════════════════════════════════════════════
       LEVEL ABOVE — top row  (y=40)  55% scale, 25% opacity
       ═══════════════════════════════════════════════ -->

  <g opacity="0.25">
    <!-- S -->
    <g transform="translate(46,40) scale(0.55)">
      <circle cy="-13" r="10.5" fill="#FFFFFF"/>
      <path d="M-17,13 C-17,1 -9,-1 0,-1 C9,-1 17,1 17,13 Z" fill="#FFFFFF"/>
    </g>
    <!-- E -->
    <g transform="translate(100,40) scale(0.55)" fill="none" stroke="#FFFFFF">
      <circle r="20"  stroke-width="2.8"/>
      <circle r="11.5" stroke-width="2.8"/>
      <circle r="3.5" fill="#FFFFFF" stroke="none"/>
    </g>
    <!-- M -->
    <g transform="translate(154,40) scale(0.55)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-19" y1="0" x2="15" y2="0" stroke-width="4"/>
      <polyline points="7,-9  17,0  7,9" fill="none" stroke-width="4"/>
    </g>
  </g>


  <!-- ═══════════════════════════════════════════════
       LEVEL BELOW — bottom row  (y=160)  55% scale, 25% opacity
       ═══════════════════════════════════════════════ -->

  <g opacity="0.25">
    <!-- S -->
    <g transform="translate(46,160) scale(0.55)">
      <circle cy="-13" r="10.5" fill="#FFFFFF"/>
      <path d="M-17,13 C-17,1 -9,-1 0,-1 C9,-1 17,1 17,13 Z" fill="#FFFFFF"/>
    </g>
    <!-- E -->
    <g transform="translate(100,160) scale(0.55)" fill="none" stroke="#FFFFFF">
      <circle r="20"  stroke-width="2.8"/>
      <circle r="11.5" stroke-width="2.8"/>
      <circle r="3.5" fill="#FFFFFF" stroke="none"/>
    </g>
    <!-- M -->
    <g transform="translate(154,160) scale(0.55)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-19" y1="0" x2="15" y2="0" stroke-width="4"/>
      <polyline points="7,-9  17,0  7,9" fill="none" stroke-width="4"/>
    </g>
  </g>

</svg>
